<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONONODE :: INCOMING TRANSMISSION</title>
<link rel="stylesheet" href="css/node.css?v=444794">
<link rel="stylesheet" href="css/chapter4.css?v=444794">
</head>
<body>

<div class="app">

  <!-- 顶栏 -->
  <div class="statusbar">
    <span class="clock-fixed" id="clockval">2026-10-13 01:02:33</span>
    <span class="sb-divider">│</span>
    <span class="sb-label">CHRONONODE</span>
    <span class="sb-node" id="nodeid">CN-BACKUP-01</span>
    <span class="sb-flex"></span>
    <span class="sb-stat" id="nodeState">COMMUNICATION: NORMAL</span>
  </div>

  <!-- 主区 -->
  <div class="main">
    <div id="output" class="output c4-output" aria-live="polite"></div>

    <div class="sidemenu">
      <button class="side-btn" id="logbtn" title="查看全部日志">
        <span class="side-icon">[≡]</span>
        <span class="side-label">全部日志</span>
      </button>
      <button class="side-btn" id="soundbtn" title="音效开关">
        <span class="side-icon" id="soundicon">[♪]</span>
        <span class="side-label" id="soundlabel">音效 开</span>
      </button>
    </div>
  </div>

</div>

<!-- 弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalhead">[ 消息 ]</span>
      <span class="modal-close" id="modalclose">[X]</span>
    </div>
    <div class="modal-body" id="modalbody"></div>
    <div class="modal-foot">
      <span class="modal-hint" id="modalhint">按 [X] 或点击空白处关闭</span>
    </div>
  </div>
</div>

<script src="js/audio.js?v=444794"></script>
<script src="js/chapter4.js?v=444794"></script>
</body>
</html>
