<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONONODE :: FINAL RECOVERY ENVIRONMENT</title>
<link rel="stylesheet" href="css/node.css?v=703007">
<link rel="stylesheet" href="css/chapter3.css?v=703007">
</head>
<body>

<div class="app">

  <!-- 顶栏 -->
  <div class="statusbar">
    <span class="clock-fixed unverified" id="clockval">2026-10-13 01:00:18</span>
    <span class="sb-divider">│</span>
    <span class="sb-label">CHRONONODE</span>
    <span class="sb-node" id="nodeid">CN-BACKUP-01</span>
    <span class="sb-flex"></span>
    <span class="sb-stat" id="nodeState">NODE STATUS: RECOVERY</span>
  </div>

  <!-- 主区：终端 + 侧边状态面板 -->
  <div class="main">
    <div id="output" class="output c3-output" aria-live="polite"></div>

    <div class="sidemenu">
      <button class="side-btn" id="logbtn" title="查看全部日志">
        <span class="side-icon">[≡]</span>
        <span class="side-label">全部日志</span>
      </button>
      <button class="side-btn" id="soundbtn" title="音效开关">
        <span class="side-icon" id="soundicon">[♪]</span>
        <span class="side-label" id="soundlabel">音效 开</span>
      </button>

      <!-- 侧边状态面板 -->
      <div class="sidepanel" id="sidepanel">
        <div class="sp-label">SYSTEM STATUS</div>

        <div class="sp-row">
          <span class="sp-k">TIME REF</span>
          <span class="sp-v" id="spTimeRef">—</span>
        </div>
        <div class="sp-row">
          <span class="sp-k">LOCAL CLK</span>
          <span class="sp-v" id="spLocalClk">UNVERIFIED</span>
        </div>
        <div class="sp-row">
          <span class="sp-k">COMM</span>
          <span class="sp-v" id="spComm">STANDBY</span>
        </div>
        <div class="sp-row">
          <span class="sp-k">MAIN NODE</span>
          <span class="sp-v bad" id="spMainNode">NO RESPONSE</span>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>[ 记录 ]</span>
      <span class="modal-close" id="modalclose">[X]</span>
    </div>
    <div class="modal-body" id="modalbody"></div>
    <div class="modal-foot">
      <span class="modal-hint" id="modalhint">按 [X] 或点击空白处关闭</span>
    </div>
  </div>
</div>

<script src="js/audio.js?v=703007"></script>
<script src="js/chapter3.js?v=703007"></script>
<script src="js/engine3.js?v=703007"></script>
</body>
</html>
